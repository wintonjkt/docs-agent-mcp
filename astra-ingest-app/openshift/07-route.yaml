apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: astra-ingest-app
  namespace: astra-ingest
  labels:
    app.kubernetes.io/name: astra-ingest-app
    app.kubernetes.io/part-of: astra-ingest
spec:
  to:
    kind: Service
    name: astra-ingest-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
