apiVersion: v1
kind: Secret
metadata:
  name: astra-ingest-secrets
  namespace: astra-ingest
  labels:
    app.kubernetes.io/name: astra-ingest-app
type: Opaque
stringData:
  # Injected directly or created via `oc create secret generic astra-ingest-secrets ...`
  ASTRA_DB_API_ENDPOINT: "<ASTRA_DB_API_ENDPOINT>"
  ASTRA_DB_APPLICATION_TOKEN: "<ASTRA_DB_APPLICATION_TOKEN>"
  COS_APIKEY: "<COS_APIKEY>"
  COS_RESOURCE_INSTANCE_ID: "<COS_RESOURCE_INSTANCE_ID>"
  UI_ACCESS_TOKEN: "<UI_ACCESS_TOKEN>"
